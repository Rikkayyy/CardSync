spring.application.name=CardSync

# Render (and similar PaaS hosts) assign their own port via $PORT and health-check
# against it -- without this, the app always binds 8080 regardless, health checks
# fail, and the platform kills/restarts the container repeatedly.
server.port=${PORT:8080}

# sslmode defaults to `disable` so the local docker-compose Postgres (no TLS)
# keeps working untouched. Managed hosts like Neon require TLS -- set
# DB_SSLMODE=require in the deployed environment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:cardsync}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${POSTGRES_USER:cardsync}
spring.datasource.password=${POSTGRES_PASSWORD:cardsync}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Neon scale to zero. Its compute suspends after ~5 min with no DB activity,
# and every query restarts that clock -- an always-on backend that touches the
# DB on a timer bills compute 24/7 and burns the free tier's monthly hours by
# mid-month. Two things did that:
#  - Fly health-checks /actuator/health every 30s, and the default DB health
#    indicator runs a validation query each time. Health now means "the JVM is
#    up", not "Postgres is reachable".
#  - Hikari kept 10 idle connections open and pinged them every 2 min
#    (keepaliveTime). Now the pool drains to zero after 60s idle and never pings.
# Cost: the first request after an idle stretch pays Neon's ~0.5s compute wake-up
# plus a fresh TLS connection -- far cheaper than the JVM cold start Fly avoids.
management.health.db.enabled=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

plaid.client-id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SECRET}
plaid.env=${PLAID_ENV:sandbox}

encryption.key=${TOKEN_ENCRYPTION_KEY}
