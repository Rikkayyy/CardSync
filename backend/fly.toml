# Fly.io app config — https://fly.io/docs/reference/configuration/
#
# Deploy from this directory: `fly deploy` (fly.toml sits next to the Dockerfile
# so the build context is `backend/`, matching the Dockerfile's relative COPYs).
#
# Secrets are NOT stored here — set them once with `fly secrets set KEY=value`:
#   JWT_SECRET, PLAID_CLIENT_ID, PLAID_SECRET, TOKEN_ENCRYPTION_KEY,
#   DB_HOST, DB_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
# (the DB_* / POSTGRES_* values come from the Neon dashboard).

app = "cardsync-backend"

# Neon project lives in AWS us-east-2 (Ohio). Fly has no Ohio region; `ord`
# (Chicago) is the nearest, with `iad` (Ashburn) a near-tie. Keeping these close
# avoids a cross-region hop on every query — easy to avoid, annoying to discover later.
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PLAID_ENV = "production"
  JWT_EXPIRATION_MS = "86400000"
  # Neon terminates TLS; the local docker-compose Postgres does not. See
  # application.properties for why this is a variable rather than hardcoded.
  DB_SSLMODE = "require"
  # Set after the Vercel project exists — the frontend's real origin.
  # SecurityConfig binds this as a List<String>, so multiple origins can be
  # comma-separated if a custom domain is added alongside the *.vercel.app one.
  CORS_ALLOWED_ORIGINS = "https://card-sync-steel.vercel.app"

[http_service]
  # Matches EXPOSE 8080 / server.port in application.properties. Fly sets $PORT
  # too, but pinning it here keeps the health check and the app in agreement.
  internal_port = 8080
  force_https = true
  auto_start_machines = true

  # THE point of moving off Render's free tier: never scale to zero, so there's
  # no 30-60s JVM cold start on the first request after an idle period.
  auto_stop_machines = "off"
  min_machines_running = 1
  # NOTE: `fly deploy` provisions a SECOND machine by default for HA, which
  # silently doubles the bill. Deploy with `fly deploy --ha=false`, or fix it
  # after the fact with `fly scale count 1`. Fly's own output suggests setting
  # min_machines_running = 0 instead — do NOT: that restores scale-to-zero and
  # with it the 30-60s JVM cold start this whole migration exists to remove.

  [[http_service.checks]]
    path = "/actuator/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    # Spring Boot on a shared-cpu-1x takes a while to come up; without a grace
    # period Fly would fail the check and restart the machine mid-startup.
    grace_period = "45s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
