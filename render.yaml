# Render Blueprint — https://render.com/docs/blueprint-spec
# Defines the backend (Docker), frontend (static site), and Postgres as code,
# so connecting this repo on Render auto-configures most of the setup.
#
# Secrets (marked `sync: false` below) are NOT stored here — Render will
# prompt for them in the dashboard when the blueprint is first applied.
# Values to paste in at that point (from backend/.env):
#   JWT_SECRET, PLAID_CLIENT_ID, PLAID_SECRET, TOKEN_ENCRYPTION_KEY
#
# Free Postgres note: Render's free database plan is time-limited (historically
# ~90 days before requiring an upgrade or a fresh instance) — confirm current
# terms in the Render dashboard before relying on it long-term.

services:
  - type: web
    name: cardsync-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: cardsync-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cardsync-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: cardsync-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: cardsync-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: cardsync-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: https://cardsync-frontend.onrender.com
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: production
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

  - type: web
    name: cardsync-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        # Actual assigned URL -- "cardsync-backend" alone was already taken,
        # Render suffixed it. Confirm this still matches the real backend URL
        # in the dashboard if the service is ever recreated.
        value: https://cardsync-backend-0h2h.onrender.com
    routes:
      # Client-side routing (react-router) — unknown paths fall through to
      # index.html instead of 404ing, so e.g. a direct load of /dashboard works.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cardsync-db
    plan: free
    databaseName: cardsync
    user: cardsync
